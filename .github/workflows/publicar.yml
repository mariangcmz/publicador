name: publicar
on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '0 12 1,15 * *' # renovar token IG (dura 60 días)
  workflow_dispatch:
concurrency: publicar
permissions:
  contents: write
jobs:
  publicar:
    if: github.event.schedule != '0 12 1,15 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node publicar.mjs
        env:
          IG_DONITA: ${{ secrets.IG_DONITA }}
          FB_DONITA: ${{ secrets.FB_DONITA }}
      - if: always()
        run: |
          git config user.name publicador
          git config user.email publicador@users.noreply.github.com
          git add cola.json
          git diff --cached --quiet || (git commit -m "cola: publicados" && git push)

  renovar-token:
    if: github.event.schedule == '0 12 1,15 * *'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.PAT_SECRETOS }}
          IG_DONITA: ${{ secrets.IG_DONITA }}
        run: |
          nuevo=$(curl -sf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_DONITA" | jq -r .access_token)
          gh secret set IG_DONITA --repo "$GITHUB_REPOSITORY" --body "$nuevo"
